# Builds the SK WALA Android app in GitHub's free cloud – no Android Studio needed.
# Open the "Actions" tab of the repository → latest run → download "SK-WALA-app".
name: Build SK WALA app

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Android 16 SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build APK (for WhatsApp) and AAB (for Google Play)
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease bundleRelease --no-daemon --stacktrace

      - name: Collect files
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/*.apk out/SK-WALA.apk
          cp app/build/outputs/bundle/release/*.aab out/SK-WALA-PlayStore.aab

      - uses: actions/upload-artifact@v4
        with:
          name: SK-WALA-app
          path: out/
