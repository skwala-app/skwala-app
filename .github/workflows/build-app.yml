# Builds the SK WALA Android app in GitHub's free cloud – no Android Studio needed.
# Open the "Actions" tab → latest run → download "SK-WALA-app".
name: Build SK WALA app

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Android 16 SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"

      - name: Build APK (for WhatsApp) and AAB (for Google Play)
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease bundleRelease --no-daemon --stacktrace

      - name: Collect files
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/*.apk out/SK-WALA.apk
          cp app/build/outputs/bundle/release/*.aab out/SK-WALA-PlayStore.aab

      - uses: actions/upload-artifact@v5
        with:
          name: SK-WALA-app
          path: out/

      # also keep the latest app files in the "app-files" branch (easy download: Code → branch app-files)
      - name: Save to app-files branch
        run: |
          cd out
          git init -q -b app-files
          git config user.name "SK WALA build"
          git config user.email "build@users.noreply.github.com"
          echo "Latest SK WALA app – built $(date -u '+%d %b %Y %H:%M UTC')" > README.md
          git add -A && git commit -qm "SK WALA app ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" app-files
